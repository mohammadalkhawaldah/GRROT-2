controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6, joint_7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.05
      joint_1: {goal: 0.03, trajectory: 0.2}
      joint_2: {goal: 0.03, trajectory: 0.2}
      joint_3: {goal: 0.03, trajectory: 0.2}
      joint_4: {goal: 0.03, trajectory: 0.2}
      joint_5: {goal: 0.03, trajectory: 0.2}
      joint_6: {goal: 0.03, trajectory: 0.2}
      joint_7: {goal: 0.03, trajectory: 0.2}

gripper_controller:
  ros__parameters:
    joints: [robotiq_85_left_knuckle_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    constraints:
      goal_time: 3.0
      stopped_velocity_tolerance: 0.05
      robotiq_85_left_knuckle_joint:
        goal: 0.03
